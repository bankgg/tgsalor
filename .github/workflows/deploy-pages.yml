name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p "$RUNNER_TEMP/tg-site"
          cp index.html sw.js robots.txt .nojekyll "$RUNNER_TEMP/tg-site/"
          cp -R vendor "$RUNNER_TEMP/tg-site/vendor"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/tg-site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
